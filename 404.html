<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0c">
    <title>404 - Page Not Found | cupient</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body class="error-page">
    <main class="error-page-main">
        <div class="error-card">
            <span class="error-eyebrow">cupient | portfolio</span>
            <h1 class="error-code gradient-text">404</h1>
            <p class="error-title">Page not found.</p>
            <p class="error-text">The page you’re looking for doesn’t exist or has been moved.</p>
            <div class="error-actions">
                <a href="/" class="btn">Return Home</a>
                <a href="/#projects" class="error-link">View projects</a>
            </div>
        </div>
    </main>
</body>
</html>
